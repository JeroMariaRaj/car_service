<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AutoCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased font-sans bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-dark-bg dark:text-dark-heading flex items-center justify-center min-h-screen relative overflow-hidden">


    <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 dark:opacity-10 animate-pulse-soft"></div>

    <div class="w-full max-w-md p-4 relative z-10">
        <div class="flex justify-center mb-8">
            <a href="index.html" class="flex items-center brand-lockup"><img src="assets/img/logo-car-only.png" alt="AutoCare" class="brand-mark"><span class="brand-copy"><span class="brand-name">Auto<span>Care</span></span><small class="brand-tagline">Modern Auto Repair</small></span></a>
        </div>

        <div class="card p-8 backdrop-blur-xl bg-white/90 dark:bg-dark-card/90">
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2 text-center">Create Account</h2>
            <p class="text-slate-500 dark:text-slate-400 text-sm text-center mb-8">Join us to manage your vehicle services easily.</p>
            
            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
                    <input type="text" class="input-field" placeholder="John Doe" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                    <input type="email" class="input-field" placeholder="you@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary w-full">Create Account</button>
            </form>
            
            <div class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
                Already have an account? <a href="login.html" class="text-primary-600 font-medium hover:text-primary-700">Log in</a>
            </div>
        </div>
        
        <!-- Quick Toggles for Demo -->
        <div class="flex justify-center gap-4 mt-8 lg:fixed lg:top-6 lg:right-8 lg:mt-0 z-50">
            <button id="theme-toggle" class="p-2 rounded-full bg-white dark:bg-dark-card shadow text-slate-500 hover:text-primary-600 transition">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
            </button>
            <button id="rtl-toggle" class="px-3 py-1 rounded-full bg-white dark:bg-dark-card shadow text-xs font-bold text-slate-500 hover:text-primary-600 transition">
                RTL
            </button>
            <a href="index.html" class="p-2 rounded-full bg-white dark:bg-dark-card shadow text-slate-500 hover:text-primary-600 transition">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Account created successfully! Please login.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
