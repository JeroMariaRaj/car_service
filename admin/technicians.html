<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="antialiased font-sans bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-dark-bg dark:text-dark-heading flex h-screen overflow-hidden">

        <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
        <div class="h-20 flex items-center px-6 border-b border-gray-800">
            <a href="../index.html" class="flex items-center brand-lockup"><img src="../assets/img/logo-car-only.png" alt="AutoCare" class="brand-mark"><span class="brand-copy"><span class="brand-name">Auto<span>Care</span></span><small class="brand-tagline">Modern Auto Repair</small></span></a>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-grid-2 mr-3 w-5 text-center"></i> Dashboard
            </a>
            <a href="analytics.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-chart-line mr-3 w-5 text-center"></i> Analytics
            </a>
            <a href="appointments.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-calendar-check mr-3 w-5 text-center"></i> Appointments
            </a>
            <a href="customers.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-users mr-3 w-5 text-center"></i> Customers
            </a>
            <a href="vehicles.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-car mr-3 w-5 text-center"></i> Vehicles
            </a>
            <a href="technicians.html" class="flex items-center px-3 py-2.5 rounded-lg bg-primary-600 text-white font-medium">
                <i class="fa-solid fa-screwdriver-wrench mr-3 w-5 text-center"></i> Technicians
            </a>
            <a href="tracking.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">

            <a href="messages.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-envelope mr-3 w-5 text-center"></i> Messages
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-800">
            <a href="../login.html" class="flex items-center px-3 py-2.5 rounded-lg text-red-400 hover:bg-slate-800 transition font-medium">

            </a>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header class="h-20 bg-white dark:bg-dark-card border-b border-gray-200 dark:border-dark-border flex items-center justify-between px-6">
            <h2 class="text-xl font-bold font-display text-slate-900 dark:text-white">Admin Portal</h2>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <button id="rtl-toggle" class="px-3 py-1.5 rounded-full bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-xs font-bold text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    RTL
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-primary-100 flex items-center justify-center text-primary-600 font-bold overflow-hidden">

                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Tech Card -->
                    <div class="card p-6 text-center group">
                        <div class="w-24 h-24 rounded-full bg-gray-200 mx-auto mb-4 overflow-hidden border-4 border-white dark:border-dark-card shadow-lg">
                            <img src="https://ui-avatars.com/api/?name=Michael+C&background=14b8a6&color=fff" alt="Michael C" class="w-full h-full object-cover">
                        </div>
                        <h4 class="text-lg font-bold text-slate-900 dark:text-white mb-1">Michael Chang</h4>
                        <p class="text-sm text-primary-600 mb-3">Master Technician</p>
                        <div class="flex justify-center gap-2 mb-4 text-xs text-slate-500">
                            <span class="bg-slate-100 dark:bg-dark-border px-2 py-1 rounded">Engine</span>
                            <span class="bg-slate-100 dark:bg-dark-border px-2 py-1 rounded">Brakes</span>
                        </div>
                        <button class="btn-outline py-1 px-3 text-xs w-full">Edit Profile</button>
                    </div>
                </div>
            </div>
        </main>

    <script src="../assets/js/main.js"></script>
