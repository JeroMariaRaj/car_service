    <!-- Main Content -->

        <!-- Dashboard Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-dark-bg">

                <div class="flex justify-between items-center mb-6">
                    <div class="flex gap-2">

                        <select class="input-field py-1.5 px-3 text-sm">
                            <option>All Statuses</option>
                            <option>Pending</option>
                            <option>Confirmed</option>
                        </select>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-500 dark:text-slate-400">
                        <thead class="text-xs text-gray-700 uppercase bg-slate-50 dark:bg-dark-border dark:text-slate-400">
                            <tr>
                                <th scope="col" class="px-4 py-3">ID</th>
                                <th scope="col" class="px-4 py-3">Customer</th>
                                <th scope="col" class="px-4 py-3">Vehicle</th>
                                <th scope="col" class="px-4 py-3">Service</th>
                                <th scope="col" class="px-4 py-3">Date & Time</th>
                                <th scope="col" class="px-4 py-3">Status</th>
                                <th scope="col" class="px-4 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const tbody = document.getElementById('appointmentsTableBody');
            
            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center">No appointments found.</td></tr>';
            } else {
                bookings.reverse().forEach((b, index) => {
                    const statusColor = b.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800';
                    const originalIndex = bookings.length - 1 - index;
                    
                    const tr = document.createElement('tr');
                    tr.className = 'border-b dark:border-dark-border hover:bg-slate-50 dark:hover:bg-dark-border/50';
                    tr.innerHTML = `
                        <td class="px-4 py-3 font-bold text-slate-900 dark:text-white">${b.id}</td>
                        <td class="px-4 py-3">Demo User</td>
                        <td class="px-4 py-3 font-mono text-xs">${b.regNumber}</td>
                        <td class="px-4 py-3 capitalize">${b.service}</td>
                        <td class="px-4 py-3">${b.date} ${b.time}</td>
                        <td class="px-4 py-3">
                            <select class="text-xs rounded border-gray-300 p-1" onchange="updateStatus(${originalIndex}, this.value)">
                                <option value="Pending" ${b.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Confirmed" ${b.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="In Service" ${b.status === 'In Service' ? 'selected' : ''}>In Service</option>
                                <option value="Completed" ${b.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <button class="text-blue-600 hover:text-blue-800 mr-2"><i class="fa-solid fa-eye"></i></button>
                            <button class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            
            window.updateStatus = function(index, newStatus) {
                // Must get un-reversed array, update, then save
                let currentBookings = JSON.parse(localStorage.getItem('bookings')) || [];
                currentBookings[index].status = newStatus;
                localStorage.setItem('bookings', JSON.stringify(currentBookings));
                
                // Show toast or refresh (simplified here)
                alert('Status updated to ' + newStatus);
            }
        });
    </script>
