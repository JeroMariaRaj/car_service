<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<body class="antialiased font-sans bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-dark-bg dark:text-dark-heading flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
        <div class="h-20 flex items-center px-6 border-b border-gray-800">
            <a href="../index.html" class="flex items-center brand-lockup"><img src="../assets/img/logo-car-only.png" alt="AutoCare" class="brand-mark"><span class="brand-copy"><span class="brand-name">Auto<span>Care</span></span><small class="brand-tagline">Modern Auto Repair</small></span></a>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center px-3 py-2.5 rounded-lg bg-primary-600 text-white font-medium">
                <i class="fa-solid fa-grid-2 mr-3 w-5 text-center"></i> Dashboard
            </a>
            <a href="analytics.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-chart-line mr-3 w-5 text-center"></i> Analytics
            </a>
            <a href="appointments.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-calendar-check mr-3 w-5 text-center"></i> Appointments
            </a>
            <a href="customers.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-users mr-3 w-5 text-center"></i> Customers
            </a>
            <a href="vehicles.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-car mr-3 w-5 text-center"></i> Vehicles
            </a>
            <a href="technicians.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-screwdriver-wrench mr-3 w-5 text-center"></i> Technicians
            </a>
            <a href="tracking.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-location-dot mr-3 w-5 text-center"></i> Vehicle Tracking
            </a>
            <a href="messages.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition font-medium">
                <i class="fa-solid fa-envelope mr-3 w-5 text-center"></i> Messages
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-800">
            <a href="../login.html" class="flex items-center px-3 py-2.5 rounded-lg text-red-400 hover:bg-slate-800 transition font-medium">
                <i class="fa-solid fa-right-from-bracket mr-3 w-5 text-center"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header class="h-20 bg-white dark:bg-dark-card border-b border-gray-200 dark:border-dark-border flex items-center justify-between px-6">
            <h2 class="text-xl font-bold font-display text-slate-900 dark:text-white">Admin Portal</h2>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <button id="rtl-toggle" class="px-3 py-1.5 rounded-full bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-xs font-bold text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    RTL
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-primary-100 flex items-center justify-center text-primary-600 font-bold overflow-hidden">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div class="hidden md:block">
                        <div class="text-sm font-bold text-slate-900 dark:text-white">Admin User</div>
                        <div class="text-xs text-slate-500">Manager</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-dark-bg">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="card p-6 border-l-4 border-primary-500 flex justify-between items-center">
                    <div>
                        <div class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Total Revenue</div>
                        <div class="text-3xl font-bold text-slate-900 dark:text-white">$12,450</div>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-primary-50 dark:bg-primary-900/20 text-primary-600 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-dollar-sign"></i>
                    </div>
                </div>
                <div class="card p-6 border-l-4 border-yellow-500 flex justify-between items-center">
                    <div>
                        <div class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Pending Appointments</div>
                        <div class="text-3xl font-bold text-slate-900 dark:text-white" id="pendingCount">0</div>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-yellow-50 dark:bg-yellow-900/20 text-yellow-600 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                </div>
                <div class="card p-6 border-l-4 border-green-500 flex justify-between items-center">
                    <div>
                        <div class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Completed Services</div>
                        <div class="text-3xl font-bold text-slate-900 dark:text-white">142</div>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-green-50 dark:bg-green-900/20 text-green-600 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-check-double"></i>
                    </div>
                </div>
                <div class="card p-6 border-l-4 border-blue-500 flex justify-between items-center">
                    <div>
                        <div class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Total Customers</div>
                        <div class="text-3xl font-bold text-slate-900 dark:text-white">89</div>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Chart -->
                <div class="lg:col-span-2 card p-6">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-6">Revenue Overview</h3>
                    <canvas id="revenueChart" height="100"></canvas>
                </div>

                <!-- Recent Appointments Admin View -->
                <div class="card p-6 flex flex-col h-full">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-6">Recent Bookings (Live)</h3>
                    <div class="flex-1 overflow-y-auto pr-2" id="adminBookingsList">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Chart.js Setup
            const ctx = document.getElementById('revenueChart').getContext('2d');
            const isDark = document.documentElement.classList.contains('dark');
            const gridColor = isDark ? '#334155' : '#e2e8f0';
            const textColor = isDark ? '#94a3b8' : '#64748b';
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Revenue ($)',
                        data: [4200, 5800, 4900, 6200, 8100, 12450],
                        borderColor: '#14b8a6',
                        backgroundColor: 'rgba(20, 184, 166, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: gridColor, drawBorder: false },
                            ticks: { color: textColor }
                        },
                        y: {
                            grid: { color: gridColor, drawBorder: false },
                            ticks: { color: textColor }
                        }
                    }
                }
            });

            // Load Bookings from LocalStorage
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const list = document.getElementById('adminBookingsList');
            const pendingCount = document.getElementById('pendingCount');
            
            let pending = 0;
            
            if (bookings.length === 0) {
                list.innerHTML = '<p class="text-slate-500 dark:text-slate-400 text-sm">No recent bookings.</p>';
            } else {
                bookings.reverse().forEach((b, index) => {
                    if (b.status === 'Pending') pending++;
                    
                    const statusColor = b.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800';
                    const div = document.createElement('div');
                    div.className = 'p-4 rounded-lg bg-slate-50 dark:bg-dark-border/50 border border-slate-200 dark:border-dark-border mb-3 last:mb-0';
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div class="font-bold text-slate-900 dark:text-white text-sm">${b.id}</div>
                            <span class="px-2 py-1 text-[10px] font-semibold rounded-full ${statusColor}">${b.status}</span>
                        </div>
                        <div class="text-xs text-slate-600 dark:text-slate-400 mb-2">
                            <span class="block"><i class="fa-solid fa-car w-4 text-center"></i> ${b.regNumber}</span>
                            <span class="block mt-1"><i class="fa-solid fa-wrench w-4 text-center"></i> <span class="capitalize">${b.service}</span></span>
                            <span class="block mt-1 text-primary-600 dark:text-primary-400 font-medium"><i class="fa-regular fa-calendar w-4 text-center"></i> ${b.date} ${b.time}</span>
                        </div>
                        ${b.status === 'Pending' ? `<button onclick="confirmBooking(${index})" class="w-full py-1.5 mt-2 bg-green-600 hover:bg-green-700 text-white text-xs font-bold rounded">Approve</button>` : ''}
                    `;
                    list.appendChild(div);
                });
            }
            
            pendingCount.textContent = pending;
            
            // Expose confirm function to window
            window.confirmBooking = function(index) {
                // Since we reversed for display, calculate original index
                const originalIndex = bookings.length - 1 - index;
                bookings[originalIndex].status = 'Confirmed';
                localStorage.setItem('bookings', JSON.stringify(bookings.reverse())); // reverse back to original order before saving
                window.location.reload();
            }
        });
    </script>
</body>
</html>
