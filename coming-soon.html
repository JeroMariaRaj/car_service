<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | AutoCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased font-sans bg-slate-900 text-white flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <div class="absolute inset-0 bg-[url('assets/images/hero.jpg')] bg-cover bg-center filter brightness-[0.2]"></div>

    <div class="relative z-10 text-center px-4 max-w-2xl mx-auto">
        <div class="w-16 h-16 rounded-xl bg-primary-600 mx-auto flex items-center justify-center text-white text-3xl font-bold mb-8">
            <i class="fa-solid fa-car-wrench"></i>
        </div>
        <h1 class="text-4xl md:text-5xl font-display font-bold mb-4">We're Tuning Up!</h1>
        <p class="text-gray-300 text-lg mb-10">Our new premium automotive platform is launching soon. Stay tuned for the ultimate car care experience.</p>
        
        <!-- Mock Countdown -->
        <div class="flex justify-center gap-4 md:gap-6 mb-12">
            <div class="flex flex-col items-center">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-white/10 backdrop-blur-md rounded-xl flex items-center justify-center text-2xl md:text-3xl font-bold mb-2 dark:bg-slate-800 dark:border-slate-700">12</div>
                <span class="text-xs text-slate-400 uppercase tracking-widest">Days</span>
            </div>
            <div class="text-3xl font-bold text-slate-500 mt-4">:</div>
            <div class="flex flex-col items-center">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-white/10 backdrop-blur-md rounded-xl flex items-center justify-center text-2xl md:text-3xl font-bold mb-2 dark:bg-slate-800 dark:border-slate-700">08</div>
                <span class="text-xs text-slate-400 uppercase tracking-widest">Hours</span>
            </div>
            <div class="text-3xl font-bold text-slate-500 mt-4">:</div>
            <div class="flex flex-col items-center">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-white/10 backdrop-blur-md rounded-xl flex items-center justify-center text-2xl md:text-3xl font-bold mb-2 dark:bg-slate-800 dark:border-slate-700">45</div>
                <span class="text-xs text-slate-400 uppercase tracking-widest">Mins</span>
            </div>
        </div>

        <form class="flex max-w-md mx-auto">
            <input type="email" class="flex-1 px-4 py-3 rounded-l-lg bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-primary-500 dark:bg-slate-800 dark:border-slate-700" placeholder="Enter your email">
            <button type="button" class="btn-primary rounded-l-none rounded-r-lg px-6">Notify Me</button>
        </form>
    </div>

</body>
</html>
