    <script src="../assets/js/customer-data.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('remindersContainer');
            const vehicles = CustomerData.getVehicles();
            
            container.innerHTML = '';
            
            if(vehicles.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500 dark:text-slate-400">
                        <i class="fa-solid fa-wrench text-4xl mb-3 text-gray-300 dark:text-slate-600"></i>
                        <p>No vehicles found. Add a vehicle to see maintenance reminders.</p>
                        <a href="vehicles.html" class="btn-primary inline-block mt-4 py-2 px-4">Add Vehicle</a>
                    </div>
                `;
                return;
            }

            // Generate mock reminders for the first two vehicles if they exist
            if(vehicles.length > 0) {
                const v = vehicles[0];
                container.innerHTML += `
                    <div class="card p-6 border-l-4 border-red-500 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-900/20 text-red-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-oil-can"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white">Oil Change Overdue</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${v.make} ${v.model} (${v.regNumber}) • Overdue by 250 miles</p>
                            </div>
                        </div>
                        <a href="../booking.html" class="btn-primary py-2 px-4 text-sm bg-red-600 hover:bg-red-700">Book Now</a>
                    </div>
                `;
            }

            if(vehicles.length > 1) {
                const v2 = vehicles[1];
                container.innerHTML += `
                    <div class="card p-6 border-l-4 border-yellow-500 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-yellow-50 dark:bg-yellow-900/20 text-yellow-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-car-battery"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white">Battery Check</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${v2.make} ${v2.model} (${v2.regNumber}) • Due in 45 days</p>
                            </div>
                        </div>
                        <a href="../booking.html" class="btn-outline py-2 px-4 text-sm">Schedule</a>
                    </div>
                `;
            }
            
            // Generic reminder for all other vehicles
            for(let i = 2; i < vehicles.length; i++) {
                const v = vehicles[i];
                container.innerHTML += `
                    <div class="card p-6 border-l-4 border-blue-500 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-gauge"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white">General Inspection</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${v.make} ${v.model} (${v.regNumber}) • Good standing</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileBtn = document.getElementById('customer-mobile-menu-btn');
            const mobileMenu = document.getElementById('customer-mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    const mainContent = document.querySelector('main');
                    if(mainContent) mainContent.classList.toggle('overflow-hidden');
                    const icon = mobileBtn.querySelector('i');
                    if (mobileMenu.classList.contains('hidden')) {
                        icon.classList.remove('fa-xmark');
                        icon.classList.add('fa-bars');
                    } else {
                        icon.classList.remove('fa-bars');
                        icon.classList.add('fa-xmark');
                    }
                });
            }
            
            // Highlight active menu items
            const currentPath = window.location.pathname.split('/').pop() || 'dashboard.html';
            document.querySelectorAll('#customer-mobile-menu a').forEach(a => {
                if (a.getAttribute('href') === currentPath) {
                    a.classList.add('bg-primary-50', 'text-primary-600', 'dark:bg-primary-900/20', 'dark:text-primary-400');
                    a.classList.remove('text-slate-600', 'hover:bg-slate-50', 'dark:text-slate-400', 'dark:hover:bg-dark-border', 'dark:hover:text-white');
                }
            });
        });
    </script>
