        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

            </a>

            <a href="vehicles.html" class="flex items-center px-3 py-2.5 rounded-lg bg-primary-50 text-primary-600 dark:bg-primary-900/20 dark:text-primary-400 font-medium">
                <i class="fa-solid fa-car mr-3 w-5 text-center"></i> My Vehicles
            </a>
            <a href="service-history.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-clock-rotate-left mr-3 w-5 text-center"></i> Service History
            </a>
            <a href="maintenance.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">

            <a href="tracking.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">

            <a href="profile.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-user mr-3 w-5 text-center"></i> My Profile

        <div class="p-4 border-t border-gray-200 dark:border-dark-border">
            <a href="../login.html" class="flex items-center px-3 py-2.5 rounded-lg text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20 transition font-medium">
                <i class="fa-solid fa-right-from-bracket mr-3 w-5 text-center"></i> Logout
            </a>
        </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-20 bg-white dark:bg-dark-bg border-b border-gray-200 dark:border-dark-border flex items-center justify-between px-6">
            <div class="flex items-center gap-3">
                <button id="customer-mobile-menu-btn" class="md:hidden w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 class="text-xl font-bold font-display text-slate-900 dark:text-white">Customer Portal</h2>
            </div>
            <div class="flex items-center gap-4">
                                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <button id="rtl-toggle" class="px-3 py-1.5 rounded-full bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-xs font-bold text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    RTL
                </button>
                <a href="profile.html" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-dark-border flex items-center justify-center text-slate-600 dark:text-gray-300 font-bold overflow-hidden border-2 border-primary-500 hover:opacity-80 transition cursor-pointer">
                    <img src="https://ui-avatars.com/api/?name=John+Doe&background=14b8a6&color=fff" alt="User">
                </a>
            </div>
                </header>

        <!-- Mobile Menu (Vertical Dropdown) -->
        <div id="customer-mobile-menu" class="hidden md:hidden fixed top-20 left-0 w-full bg-white dark:bg-dark-bg border-b border-gray-200 dark:border-dark-border z-50 shadow-xl overflow-y-auto" style="max-height: calc(100vh - 5rem);">
            <nav class="flex flex-col py-2 px-4 space-y-1">
                <a href="dashboard.html" class="flex items-center px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                    <i class="fa-solid fa-grid-2 mr-3 w-5 text-center"></i> Dashboard
                </a>
                <a href="vehicles.html" class="flex items-center px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                    <i class="fa-solid fa-car mr-3 w-5 text-center"></i> My Vehicles
                </a>
                <a href="service-history.html" class="flex items-center px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                    <i class="fa-solid fa-clock-rotate-left mr-3 w-5 text-center"></i> Service History
                </a>
                <a href="maintenance.html" class="flex items-center px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                    <i class="fa-solid fa-wrench mr-3 w-5 text-center"></i> Maintenance
                </a>
                <a href="tracking.html" class="flex items-center px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                    <i class="fa-solid fa-location-crosshairs mr-3 w-5 text-center"></i> Vehicle Tracking
                </a>
                <a href="profile.html" class="flex items-center px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                    <i class="fa-solid fa-user mr-3 w-5 text-center"></i> My Profile
                </a>
            </nav>
        </div>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-dark-bg">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Garage</h3>
                <button class="btn-primary py-2 px-4 text-sm" onclick="openVehicleModal()"><i class="fa-solid fa-plus mr-2"></i> Add Vehicle</button>
            </div>

            <div id="vehiclesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Vehicles will be populated here via JS -->
            </div>
        </main>
        
        <!-- Add/Edit Vehicle Modal -->
        <div id="vehicleModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
            <div class="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all">
                <div class="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center">
                    <h3 id="modalTitle" class="text-lg font-bold text-slate-900 dark:text-white">Add Vehicle</h3>
                    <button type="button" onclick="closeVehicleModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white dark:text-slate-300">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <form id="vehicleForm" onsubmit="handleVehicleSubmit(event)" class="p-6 space-y-4">
                    <input type="hidden" id="vehicleId">
                    
                    <div id="formImagePreview" class="w-full h-32 bg-gray-100 dark:bg-slate-800 rounded-xl overflow-hidden hidden flex items-center justify-center bg-cover bg-center border border-gray-200 dark:border-slate-700 transition-all duration-300 relative">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                            <span class="text-white text-sm font-semibold backdrop-blur-md px-3 py-1 bg-black/30 rounded-full border border-white/20"><i class="fa-solid fa-sparkles mr-1"></i> Auto-Generated Image</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Make</label>
                        <input type="text" id="vMake" required class="input-field py-2 px-3" placeholder="e.g. BMW" oninput="updateFormPreview()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Model</label>
                        <input type="text" id="vModel" required class="input-field py-2 px-3" placeholder="e.g. M3" oninput="updateFormPreview()">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Year</label>
                            <input type="number" id="vYear" required class="input-field py-2 px-3" placeholder="2021">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mileage</label>
                            <input type="number" id="vMileage" required class="input-field py-2 px-3" placeholder="24500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">License Plate / Reg</label>
                        <input type="text" id="vReg" required class="input-field py-2 px-3 uppercase" placeholder="ABC-1234">
                    </div>
                    <div class="pt-4 flex gap-3">
                        <button type="button" onclick="closeVehicleModal()" class="flex-1 btn-outline py-2">Cancel</button>
                        <button type="submit" class="flex-1 btn-primary py-2">Save Vehicle</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Vehicle Image Modal -->
        <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center transition-opacity opacity-0">
            <div class="w-full max-w-2xl mx-4 relative transform scale-95 transition-transform" id="imageModalContent">
                <button type="button" onclick="closeImageModal()" class="absolute -top-12 right-0 text-white hover:text-gray-300 transition">
                    <i class="fa-solid fa-xmark text-3xl"></i>
                </button>
                <div class="bg-slate-900 rounded-2xl overflow-hidden shadow-2xl relative min-h-[300px] flex items-center justify-center">
                    <div id="imageLoading" class="absolute inset-0 flex flex-col items-center justify-center text-white">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-primary-500"></i>
                        <p>Loading vehicle image...</p>
                    </div>
                    <img id="vehicleDisplayImg" src="" alt="Vehicle Preview" class="w-full h-auto object-cover hidden" onload="this.classList.remove('hidden'); document.getElementById('imageLoading').classList.add('hidden');">
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-6 text-white">
                        <h3 id="imageModalTitle" class="text-2xl font-bold font-display">Vehicle Preview</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/customer-data.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>

        // Get vehicles from CustomerData
        function getVehicles() {
            return CustomerData.getVehicles();
        }

        // Render vehicles grid
        function renderVehicles() {
            const grid = document.getElementById('vehiclesGrid');
            const vehicles = getVehicles();
            
            grid.innerHTML = '';
            
            if (vehicles.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 dark:text-slate-400">
                        <i class="fa-solid fa-car-side text-4xl mb-3 text-gray-300 dark:text-slate-600"></i>
                        <p>No vehicles found. Add your first vehicle to get started.</p>
                    </div>
                `;
                return;
            }

            vehicles.forEach(v => {
                // Generate company related image as requested
                const imageUrl = `../assets/img/cars/company_car.jpg`;

                grid.innerHTML += `
                    <div class="card p-0 overflow-hidden group shadow-md hover:shadow-lg transition-shadow">
                        <div class="h-40 bg-gray-200 dark:bg-dark-border relative flex items-center justify-center cursor-pointer overflow-hidden bg-cover bg-center" style="background-image: url('${imageUrl}');" onclick="showVehicleImage('${v.make}', '${v.model}')">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm z-10">
                                <span class="text-white font-semibold text-sm bg-black/60 px-3 py-1 rounded-full backdrop-blur-md border border-white/20"><i class="fa-solid fa-expand mr-1"></i> View Full Image</span>
                            </div>
                            <button onclick="event.stopPropagation(); deleteVehicle('${v.id}')" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 dark:bg-slate-800/90 text-red-600 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-sm hover:bg-red-50 dark:hover:bg-slate-700 z-20" title="Delete">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h4 class="text-xl font-bold text-slate-900 dark:text-white">${v.make} ${v.model}</h4>
                                    <p class="text-sm text-slate-500 dark:text-slate-400 font-mono">${v.regNumber} • ${v.year}</p>
                                </div>
                                <span class="px-2 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded-full">Active</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <div>
                                    <span class="block text-xs text-slate-500 dark:text-slate-400">Mileage</span>
                                    <span class="block text-sm font-medium text-slate-900 dark:text-white">${parseInt(v.mileage).toLocaleString()} mi</span>
                                </div>
                                <div>
                                    <span class="block text-xs text-slate-500 dark:text-slate-400">Next Service</span>
                                    <span class="block text-sm font-medium text-primary-600">In 2,500 mi</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <a href="../booking.html" class="flex-1 btn-primary py-2 text-sm text-center">Book Service</a>
                                <button onclick="openVehicleModal('${v.id}')" class="btn-outline px-3 py-2 text-sm" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Modal Controls
        let previewTimeout;
        function updateFormPreview() {
            const make = document.getElementById('vMake').value;
            const model = document.getElementById('vModel').value;
            const preview = document.getElementById('formImagePreview');
            
            clearTimeout(previewTimeout);
            
            if (make.length > 1 && model.length > 0) {
                previewTimeout = setTimeout(() => {
                    const query = encodeURIComponent(`${make} ${model} car`);
                    preview.style.backgroundImage = `url('https://loremflickr.com/400/300/${query}')`;
                    preview.classList.remove('hidden');
                }, 800); // Debounce typing
            } else {
                preview.classList.add('hidden');
                preview.style.backgroundImage = 'none';
            }
        }

        function openVehicleModal(id = null) {
            const modal = document.getElementById('vehicleModal');
            const form = document.getElementById('vehicleForm');
            const title = document.getElementById('modalTitle');
            const preview = document.getElementById('formImagePreview');
            
            form.reset();
            preview.classList.add('hidden');
            preview.style.backgroundImage = 'none';
            
            if (id) {
                title.textContent = 'Edit Vehicle';
                const vehicle = getVehicles().find(v => v.id === id);
                if (vehicle) {
                    document.getElementById('vehicleId').value = vehicle.id;
                    document.getElementById('vMake').value = vehicle.make;
                    document.getElementById('vModel').value = vehicle.model;
                    document.getElementById('vYear').value = vehicle.year;
                    document.getElementById('vMileage').value = vehicle.mileage;
                    document.getElementById('vReg').value = vehicle.regNumber;
                    updateFormPreview(); // Show existing image
                }
            } else {
                title.textContent = 'Add Vehicle';
                document.getElementById('vehicleId').value = '';
            }
            
            modal.classList.remove('hidden');
        }

        function closeVehicleModal() {
            document.getElementById('vehicleModal').classList.add('hidden');
        }

        // Image Modal Controls
        function showVehicleImage(make, model) {
            const modal = document.getElementById('imageModal');
            const content = document.getElementById('imageModalContent');
            const title = document.getElementById('imageModalTitle');
            const img = document.getElementById('vehicleDisplayImg');
            const loader = document.getElementById('imageLoading');

            title.textContent = `${make} ${model}`;
            
            // Reset image state
            img.classList.add('hidden');
            loader.classList.remove('hidden');
            img.src = '';
            
            // Generate a random seed based on the car make/model so it stays consistent per car during the session, but is effectively random
            const query = encodeURIComponent(`${make} ${model} car`);
            img.src = `https://loremflickr.com/800/600/${query}?random=1`;
            
            // Show modal with animation
            modal.classList.remove('hidden');
            void modal.offsetWidth; // Reflow
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            const content = document.getElementById('imageModalContent');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // CRUD Operations
        function handleVehicleSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('vehicleId').value;
            const newVehicle = {
                id: id ? id : Date.now().toString(),
                make: document.getElementById('vMake').value,
                model: document.getElementById('vModel').value,
                year: document.getElementById('vYear').value,
                mileage: document.getElementById('vMileage').value,
                regNumber: document.getElementById('vReg').value.toUpperCase()
            };
            
            let vehicles = getVehicles();
            
            if (id) {
                // Update
                vehicles = vehicles.map(v => v.id === id ? newVehicle : v);
            } else {
                // Create
                vehicles.push(newVehicle);
            }
            
            CustomerData.saveVehicles(vehicles);
            closeVehicleModal();
            renderVehicles();
        }

        function deleteVehicle(id) {
            if (confirm('Are you sure you want to delete this vehicle?')) {
                let vehicles = getVehicles();
                vehicles = vehicles.filter(v => v.id !== id);
                CustomerData.saveVehicles(vehicles);
                renderVehicles();
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            renderVehicles();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileBtn = document.getElementById('customer-mobile-menu-btn');
            const mobileMenu = document.getElementById('customer-mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    const mainContent = document.querySelector('main');
                    if(mainContent) mainContent.classList.toggle('overflow-hidden');
                    const icon = mobileBtn.querySelector('i');
                    if (mobileMenu.classList.contains('hidden')) {
                        icon.classList.remove('fa-xmark');
                        icon.classList.add('fa-bars');
                    } else {
                        icon.classList.remove('fa-bars');
                        icon.classList.add('fa-xmark');
                    }
                });
            }
            
            // Highlight active menu items
            const currentPath = window.location.pathname.split('/').pop() || 'dashboard.html';
            document.querySelectorAll('#customer-mobile-menu a').forEach(a => {
                if (a.getAttribute('href') === currentPath) {
                    a.classList.add('bg-primary-50', 'text-primary-600', 'dark:bg-primary-900/20', 'dark:text-primary-400');
                    a.classList.remove('text-slate-600', 'hover:bg-slate-50', 'dark:text-slate-400', 'dark:hover:bg-dark-border', 'dark:hover:text-white');
                }
            });
        });
    </script>
</body>
</html>
