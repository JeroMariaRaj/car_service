<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles | AutoCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="antialiased font-sans bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-dark-bg dark:text-dark-heading flex h-screen overflow-hidden">

        <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-dark-card border-r border-gray-200 dark:border-dark-border flex flex-col hidden md:flex">
        <div class="h-20 flex items-center px-6 border-b border-gray-200 dark:border-dark-border">
            <a href="../index.html" class="flex items-center brand-lockup"><img src="../assets/img/logo-car-only.png" alt="AutoCare car mark" class="brand-mark"><span class="brand-copy"><span class="brand-name">Auto<span>Care</span></span><small class="brand-tagline">Modern Auto Repair</small></span></a>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-grid-2 mr-3 w-5 text-center"></i> Dashboard
            </a>
            <a href="vehicles.html" class="flex items-center px-3 py-2.5 rounded-lg bg-primary-50 text-primary-600 dark:bg-primary-900/20 dark:text-primary-400 font-medium">
                <i class="fa-solid fa-car mr-3 w-5 text-center"></i> My Vehicles
            </a>
            <a href="service-history.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-clock-rotate-left mr-3 w-5 text-center"></i> Service History
            </a>
            <a href="maintenance.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-wrench mr-3 w-5 text-center"></i> Maintenance
            </a>
            <a href="tracking.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-location-crosshairs mr-3 w-5 text-center"></i> Vehicle Tracking
            </a>
            <a href="profile.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-user mr-3 w-5 text-center"></i> My Profile
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-200 dark:border-dark-border">
            <a href="../login.html" class="flex items-center px-3 py-2.5 rounded-lg text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20 transition font-medium">
                <i class="fa-solid fa-right-from-bracket mr-3 w-5 text-center"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-20 bg-white dark:bg-dark-bg border-b border-gray-200 dark:border-dark-border flex items-center justify-between px-6">
            <h2 class="text-xl font-bold font-display text-slate-900 dark:text-white">Customer Portal</h2>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <button id="rtl-toggle" class="px-3 py-1.5 rounded-full bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-xs font-bold text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    RTL
                </button>
                <a href="profile.html" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-dark-border flex items-center justify-center text-slate-600 dark:text-gray-300 font-bold overflow-hidden border-2 border-primary-500 hover:opacity-80 transition cursor-pointer">
                    <img src="https://ui-avatars.com/api/?name=John+Doe&background=14b8a6&color=fff" alt="User">
                </a>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-dark-bg">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Garage</h3>
                <button class="btn-primary py-2 px-4 text-sm" onclick="openVehicleModal()"><i class="fa-solid fa-plus mr-2"></i> Add Vehicle</button>
            </div>

            <div id="vehiclesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Vehicles will be populated here via JS -->
            </div>
        </main>
        
        <!-- Add/Edit Vehicle Modal -->
        <div id="vehicleModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
            <div class="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all">
                <div class="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center">
                    <h3 id="modalTitle" class="text-lg font-bold text-slate-900 dark:text-white">Add Vehicle</h3>
                    <button type="button" onclick="closeVehicleModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white dark:text-slate-300">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <form id="vehicleForm" onsubmit="handleVehicleSubmit(event)" class="p-6 space-y-4">
                    <input type="hidden" id="vehicleId">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Make</label>
                        <input type="text" id="vMake" required class="input-field py-2 px-3" placeholder="e.g. BMW">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Model</label>
                        <input type="text" id="vModel" required class="input-field py-2 px-3" placeholder="e.g. M3">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Year</label>
                            <input type="number" id="vYear" required class="input-field py-2 px-3" placeholder="2021">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mileage</label>
                            <input type="number" id="vMileage" required class="input-field py-2 px-3" placeholder="24500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">License Plate / Reg</label>
                        <input type="text" id="vReg" required class="input-field py-2 px-3 uppercase" placeholder="ABC-1234">
                    </div>
                    <div class="pt-4 flex gap-3">
                        <button type="button" onclick="closeVehicleModal()" class="flex-1 btn-outline py-2">Cancel</button>
                        <button type="submit" class="flex-1 btn-primary py-2">Save Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        // Initial Mock Data if localStorage is empty
        const defaultVehicles = [
            { id: Date.now().toString(), make: 'BMW', model: 'M3', year: 2021, mileage: 24500, reg: 'ABC-1234' },
            { id: (Date.now() + 1).toString(), make: 'Audi', model: 'Q7', year: 2023, mileage: 12000, reg: 'XYZ-9876' }
        ];

        // Initialize vehicles in localStorage
        function initVehicles() {
            if (!localStorage.getItem('userVehicles')) {
                localStorage.setItem('userVehicles', JSON.stringify(defaultVehicles));
            }
        }

        // Get vehicles from localStorage
        function getVehicles() {
            return JSON.parse(localStorage.getItem('userVehicles')) || [];
        }

        // Render vehicles grid
        function renderVehicles() {
            const grid = document.getElementById('vehiclesGrid');
            const vehicles = getVehicles();
            
            grid.innerHTML = '';
            
            if (vehicles.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 dark:text-slate-400">
                        <i class="fa-solid fa-car-side text-4xl mb-3 text-gray-300 dark:text-slate-600"></i>
                        <p>No vehicles found. Add your first vehicle to get started.</p>
                    </div>
                `;
                return;
            }

            vehicles.forEach(v => {
                grid.innerHTML += `
                    <div class="card p-0 overflow-hidden group">
                        <div class="h-32 bg-gray-200 dark:bg-dark-border relative flex items-center justify-center">
                            <i class="fa-solid fa-car-side text-5xl text-slate-400 dark:text-slate-500 transition-transform duration-500 group-hover:scale-110"></i>
                            <button onclick="deleteVehicle('${v.id}')" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-sm hover:bg-red-200" title="Delete">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h4 class="text-xl font-bold text-slate-900 dark:text-white">${v.make} ${v.model}</h4>
                                    <p class="text-sm text-slate-500 dark:text-slate-400 font-mono">${v.reg} • ${v.year}</p>
                                </div>
                                <span class="px-2 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded-full">Active</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <div>
                                    <span class="block text-xs text-slate-500 dark:text-slate-400">Mileage</span>
                                    <span class="block text-sm font-medium text-slate-900 dark:text-white">${parseInt(v.mileage).toLocaleString()} mi</span>
                                </div>
                                <div>
                                    <span class="block text-xs text-slate-500 dark:text-slate-400">Next Service</span>
                                    <span class="block text-sm font-medium text-primary-600">In 2,500 mi</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <a href="../booking.html" class="flex-1 btn-primary py-2 text-sm text-center">Book Service</a>
                                <button onclick="openVehicleModal('${v.id}')" class="btn-outline px-3 py-2 text-sm" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Modal Controls
        function openVehicleModal(id = null) {
            const modal = document.getElementById('vehicleModal');
            const form = document.getElementById('vehicleForm');
            const title = document.getElementById('modalTitle');
            
            form.reset();
            
            if (id) {
                title.textContent = 'Edit Vehicle';
                const vehicle = getVehicles().find(v => v.id === id);
                if (vehicle) {
                    document.getElementById('vehicleId').value = vehicle.id;
                    document.getElementById('vMake').value = vehicle.make;
                    document.getElementById('vModel').value = vehicle.model;
                    document.getElementById('vYear').value = vehicle.year;
                    document.getElementById('vMileage').value = vehicle.mileage;
                    document.getElementById('vReg').value = vehicle.reg;
                }
            } else {
                title.textContent = 'Add Vehicle';
                document.getElementById('vehicleId').value = '';
            }
            
            modal.classList.remove('hidden');
        }

        function closeVehicleModal() {
            document.getElementById('vehicleModal').classList.add('hidden');
        }

        // CRUD Operations
        function handleVehicleSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('vehicleId').value;
            const newVehicle = {
                id: id ? id : Date.now().toString(),
                make: document.getElementById('vMake').value,
                model: document.getElementById('vModel').value,
                year: document.getElementById('vYear').value,
                mileage: document.getElementById('vMileage').value,
                reg: document.getElementById('vReg').value.toUpperCase()
            };
            
            let vehicles = getVehicles();
            
            if (id) {
                // Update
                vehicles = vehicles.map(v => v.id === id ? newVehicle : v);
            } else {
                // Create
                vehicles.push(newVehicle);
            }
            
            localStorage.setItem('userVehicles', JSON.stringify(vehicles));
            closeVehicleModal();
            renderVehicles();
        }

        function deleteVehicle(id) {
            if (confirm('Are you sure you want to delete this vehicle?')) {
                let vehicles = getVehicles();
                vehicles = vehicles.filter(v => v.id !== id);
                localStorage.setItem('userVehicles', JSON.stringify(vehicles));
                renderVehicles();
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            initVehicles();
            renderVehicles();
        });
    </script>
</body>
</html>
