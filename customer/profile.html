        <!-- Profile Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-dark-bg">
            <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-6">My Profile</h3>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="card p-6 lg:col-span-1 text-center">
                    <img src="https://ui-avatars.com/api/?name=John+Doe&background=14b8a6&color=fff&size=128" alt="User" class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-primary-100">
                    <h4 class="text-xl font-bold text-slate-900 dark:text-white">John Doe</h4>
                    <p class="text-slate-500 mb-4">Premium Member</p>
                    <button class="btn-outline w-full rounded-lg">Change Photo</button>
                </div>
                <div class="card p-6 lg:col-span-2">
                    <h4 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Personal Information</h4>
                    <form class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">First Name</label>
                                <input type="text" value="John" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:border-primary-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Last Name</label>
                                <input type="text" value="Doe" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:border-primary-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                            <input type="email" value="john.doe@example.com" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:border-primary-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Phone Number</label>
                            <input type="tel" value="+1 (555) 123-4567" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:border-primary-500">
                        </div>
                        <div class="pt-4 border-t border-gray-200 dark:border-gray-700">

                        </div>
                    </form>
                </div>
            </div>

    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileBtn = document.getElementById('customer-mobile-menu-btn');
            const mobileMenu = document.getElementById('customer-mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    const mainContent = document.querySelector('main');
                    if(mainContent) mainContent.classList.toggle('overflow-hidden');
                    const icon = mobileBtn.querySelector('i');
                    if (mobileMenu.classList.contains('hidden')) {
                        icon.classList.remove('fa-xmark');
                        icon.classList.add('fa-bars');
                    } else {
                        icon.classList.remove('fa-bars');
                        icon.classList.add('fa-xmark');
                    }
                });
            }
            
            // Highlight active menu items
            const currentPath = window.location.pathname.split('/').pop() || 'dashboard.html';
            document.querySelectorAll('#customer-mobile-menu a').forEach(a => {
                if (a.getAttribute('href') === currentPath) {
                    a.classList.add('bg-primary-50', 'text-primary-600', 'dark:bg-primary-900/20', 'dark:text-primary-400');
                    a.classList.remove('text-slate-600', 'hover:bg-slate-50', 'dark:text-slate-400', 'dark:hover:bg-dark-border', 'dark:hover:text-white');
                }
            });
        });
    </script>
