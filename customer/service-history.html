        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

            <a href="maintenance.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">
                <i class="fa-solid fa-wrench mr-3 w-5 text-center"></i> Maintenance
            </a>
            <a href="tracking.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">

            <a href="profile.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-dark-border dark:hover:text-white transition font-medium">

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-20 bg-white dark:bg-dark-bg border-b border-gray-200 dark:border-dark-border flex items-center justify-between px-6">
            <h2 class="text-xl font-bold font-display text-slate-900 dark:text-white">Customer Portal</h2>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">

                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <button id="rtl-toggle" class="px-3 py-1.5 rounded-full bg-slate-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-gray-700 text-xs font-bold text-slate-500 hover:text-primary-600 dark:text-slate-400 transition">
                    RTL
                </button>
                <a href="profile.html" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-dark-border flex items-center justify-center text-slate-600 dark:text-gray-300 font-bold overflow-hidden border-2 border-primary-500 hover:opacity-80 transition cursor-pointer">
                    <img src="https://ui-avatars.com/api/?name=John+Doe&background=14b8a6&color=fff" alt="User">
                </a>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-dark-bg">
            <div class="card p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white">Past Services</h3>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" class="input-field py-1.5 px-3 text-sm" placeholder="Search...">
                        <button class="btn-outline py-1.5 px-3 text-sm"><i class="fa-solid fa-filter"></i></button>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-500 dark:text-slate-400">
                        <thead class="text-xs text-gray-700 uppercase bg-slate-50 dark:bg-dark-border dark:text-slate-400">
                            <tr>
                                <th scope="col" class="px-4 py-3">ID</th>
                                <th scope="col" class="px-4 py-3">Vehicle</th>
                                <th scope="col" class="px-4 py-3">Service</th>
                                <th scope="col" class="px-4 py-3">Date</th>
                                <th scope="col" class="px-4 py-3">Amount</th>
                                <th scope="col" class="px-4 py-3">Status</th>
                                <th scope="col" class="px-4 py-3 text-right">Invoice</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/customer-data.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const history = CustomerData.getServiceHistory();
            const tbody = document.getElementById('historyTableBody');
            
            function renderHistory(data) {
                tbody.innerHTML = '';
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-500">No past services found.</td></tr>`;
                    return;
                }
                
                data.forEach(item => {
                    const statusColor = item.status === 'Completed' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800';
                    const tr = document.createElement('tr');
                    tr.className = 'border-b dark:border-dark-border hover:bg-slate-50 dark:hover:bg-dark-border/50';
                    
                    let vehicleDisplay = item.regNumber;
                    const v = CustomerData.getVehicleByReg(item.regNumber);
                    if(v) vehicleDisplay = `${v.make} ${v.model} (${item.regNumber})`;

                    tr.innerHTML = `
                        <td class="px-4 py-3 font-medium text-slate-900 dark:text-white">${item.id}</td>
                        <td class="px-4 py-3">${vehicleDisplay}</td>
                        <td class="px-4 py-3">${item.service}</td>
                        <td class="px-4 py-3">${item.date}</td>
                        <td class="px-4 py-3">$${item.amount.toFixed(2)}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${statusColor}">${item.status}</span>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <button class="text-primary-600 hover:text-primary-700" onclick="showCustomAlert('Invoice Download', 'Your invoice is being downloaded.', true)"><i class="fa-solid fa-file-pdf"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            
            renderHistory(history);

            // Filter logic
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = history.filter(item => 
                    item.id.toLowerCase().includes(term) ||
                    item.service.toLowerCase().includes(term) ||
                    item.regNumber.toLowerCase().includes(term)
                );
                renderHistory(filtered);
            });
        });
    </script>
</body>
</html>
